[package]
name = "sonium-solvers-eigen"
version = "0.5.0"
description = "Eigenvalue solvers (LOBPCG) and adjoint sensitivities for sonium"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
sonium-solvers-core = { workspace = true }
sonium-solvers-direct = { workspace = true }
sonium-solvers-sparse = { workspace = true }
sonium-compute = { workspace = true, optional = true }
num-complex = { workspace = true, features = ["serde"] }
num-traits = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
sonium-solvers-preconditioners = { workspace = true }
approx = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
cuda = ["sonium-compute/cuda"]
