[package]
name = "sonium-solvers-iterative"
version = "0.5.0"
description = "Iterative Krylov solvers: GMRES family, CG, BiCGSTAB, IDR(s), MINRES, TFQMR"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
sonium-solvers-core = { workspace = true }
sonium-solvers-sparse = { workspace = true }
sonium-solvers-sys = { workspace = true }
sonium-solvers-direct = { workspace = true }
sonium-compute = { workspace = true }
num-complex = { workspace = true, features = ["serde"] }
num-traits = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
sonium-solvers-preconditioners = { workspace = true }
approx = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
cuda = ["sonium-compute/cuda"]
metal = ["sonium-compute/metal"]
