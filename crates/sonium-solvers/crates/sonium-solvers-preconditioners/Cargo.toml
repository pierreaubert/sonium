[package]
name = "sonium-solvers-preconditioners"
version = "0.5.0"
description = "Preconditioners: Jacobi, ILU/ILUT/HILU, AMG, Schwarz, Chebyshev, saddle-point"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
sonium-solvers-core = { workspace = true }
sonium-solvers-sys = { workspace = true }
sonium-solvers-sparse = { workspace = true }
sonium-solvers-direct = { workspace = true }
sonium-solvers-eigen = { workspace = true }
sonium-compute = { workspace = true }
num-complex = { workspace = true, features = ["serde"] }
num-traits = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sonium-solvers-iterative = { workspace = true }
approx = { workspace = true }
rand = { workspace = true }

[features]
experimental-gnn = []
cuda = ["sonium-compute/cuda"]
