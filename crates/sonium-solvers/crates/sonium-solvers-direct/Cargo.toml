[package]
name = "sonium-solvers-direct"
version = "0.5.0"
description = "Direct solvers: dense LU/Cholesky, sparse LU/Cholesky, multifrontal BLR"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
sonium-compute = { workspace = true }
sonium-solvers-core = { workspace = true }
sonium-solvers-sparse = { workspace = true }
num-complex = { workspace = true, features = ["serde"] }
num-traits = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
half = { workspace = true }

[features]
cuda = ["sonium-compute/cuda"]
# Linux-only: link the system OpenBLAS for the lapack_compare vendor arms.
bench-openblas = []

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sonium-compute = { workspace = true }
sonium-solvers-core = { workspace = true }

[[bench]]
name = "lapack_compare"
harness = false
