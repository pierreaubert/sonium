[package]
name = "sonium-sim-motor"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Showcase mini-app for the sonium-fem rotating-machine solver: GEO_30MM operating points, gamma sweeps, MTPA, thermal and rotor-stress checks"
license = { workspace = true }
repository = { workspace = true }
keywords = ["motor", "fem", "pmsm", "simulation"]
categories = ["science", "simulation"]

[lib]
name = "sonium_sim_motor"
path = "src/lib.rs"

[[bin]]
name = "motor-sim"
path = "src/bin/motor_sim.rs"
required-features = ["cli"]

[dependencies]
sonium-fem = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, optional = true }

[features]
cli = ["dep:clap"]
