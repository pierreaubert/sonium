[features]
default = []
qa-binaries = []
funct-python = ["dep:pyo3"]
meshlang = []
meshlang-wasm = ["dep:sonium-roomsim"]
# Binary-local unit tests are opt-in. Ordinary `cargo test -p sonium-qa`
# exercises the lightweight integration contracts without compiling the full
# QA executable graph; `just qa-bin-tests` retains these focused tests.
qa-bin-tests = ["qa-binaries"]
# Re-enable the legacy room simulation binaries (qa-bem-freq-sweep-recycling
# and qa-pipeline-physics-validation), which depend on sonium-sim-room.
legacy-sims = ["dep:sonium-sim-room"]
# Independent Wolfram Engine reference checks for every `sonium-sim-*`
# application crate. Kept opt-in so ordinary sonium-qa builds do not pull in
# the propeller and room application dependency graph (PC-fan production QA
# is part of the default manifest).
sim-wolfram = [
    "dep:sonium-sim-propellers",
    "dep:sonium-sim-room",
]
# Deterministic production-surrogate checks for the propeller application.
# Separate from `sim-wolfram`: no external Wolfram Engine is involved.
sim-propellers = ["dep:sonium-sim-propellers"]
# Validate the CUDA backend GMRES path against the CPU baseline. Requires
# the `cuda` feature on `sonium-compute` (mature cuBLAS/cuSPARSE via
# cudarc) and a CUDA driver at runtime.
cuda = [
    "sonium-compute/cuda",
    "sonium-bem/cuda",
    "sonium-fem/cuda",
    "sonium-sim-pcfan/cuda",
    "sonium-sim-speaker/cuda",
    "sonium-sim-speaker-modeling/cuda",
]
# Validate the Metal backend GMRES path against the CPU baseline. Also
# enables the Phase 1.3 Metal-backed BEM tbem assembly path consumed by
# `qa-bem-assembly-metal-bench`.
metal = ["sonium-compute/metal", "sonium-bem/metal"]

