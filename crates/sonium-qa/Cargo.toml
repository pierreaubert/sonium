[package]
name = "sonium-qa"
version = "0.2.0"
description = "Quality assurance suite: accuracy validation binaries for sonium"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "sonium_qa"
path = "src/lib.rs"

[dependencies]
# Internal crates
sonium-solvers = { workspace = true }
sonium-solvers-core = { workspace = true }
sonium-solvers-direct = { workspace = true }
sonium-solvers-sparse = { workspace = true }
sonium-solvers-preconditioners = { workspace = true }
sonium-bem = { workspace = true }
sonium-fem = { workspace = true, features = ["meshlang"] }
sonium-wave = { workspace = true }
sonium-xem = { workspace = true }
sonium-mesher = { workspace = true }
sonium-roomsim = { workspace = true, optional = true, features = ["meshlang"] }
meshlang-compiler = { workspace = true }
ed25519-zebra = { workspace = true }
meshlang-ast = { workspace = true }
meshlang-parser = { workspace = true }
sonium-compute = { workspace = true }
sonium-bench = { workspace = true }
sonium-sim-room = { workspace = true, optional = true }
sonium-sim-pcfan = { workspace = true }
sonium-sim-propellers = { workspace = true, optional = true }
sonium-sim-speaker = { workspace = true }
sonium-sim-speaker-modeling = { workspace = true }
sonium-coupling = { workspace = true }
sonium-sim-structural-mechanics = { workspace = true }
sonium-sim-jlr = { workspace = true }
sonium-fft = { workspace = true }
sonium-fastmath = { workspace = true }
sonium-audio = { workspace = true }
sonium-solvers-optimization = { workspace = true }

# Numerical
num-complex = { workspace = true }
num-traits = { workspace = true }
approx = { workspace = true }

# Parallel
rayon = { workspace = true }

# Half-precision
half = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Embedded Python for /FUNCT_PYTHON (Phase 7, feature-gated)
pyo3 = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }

# Misc
rand = { workspace = true }

# Logging
env_logger = { workspace = true }
log = { workspace = true }

# CLI
clap = { workspace = true }
chrono = { workspace = true }

# Special functions
spec_math = { workspace = true }

# Directories
directories = { workspace = true }

# Optional FFTW differential test
libloading = { workspace = true }

# Temp files
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

